# Mobile smoke: welcome → login with a seeded teacher → role home → sign out.
# Needs `pnpm dev:setup` and a simulator/emulator with the app installed.
# Run: maestro test apps/mobile/.maestro
appId: ma.tadriss.app
---
- launchApp:
    clearState: true
- assertVisible:
    id: brand
- tapOn:
    id: login
- tapOn:
    id: email
- inputText: prof1@almanar.test
- tapOn:
    id: password
- inputText: Tadriss-dev-2026
- tapOn:
    id: submit
- assertVisible:
    id: greeting
- tapOn:
    id: sign-out
- assertVisible:
    id: brand
